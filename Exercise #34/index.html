
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 4 - Add and Remove Items</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Adding and Removing Elements</h1>

        <p>Manage your list using the buttons below.</p>

        <ul id="myList">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <div class="buttons">

            <button class="add-btn" onclick="addItem()">
                Add Item
            </button>

            <button class="remove-btn" onclick="removeItem()">
                Remove Item
            </button>

        </div>

        <p id="message"></p>

    </div>

    <script src="main.js"></script>

</body>
</html>
